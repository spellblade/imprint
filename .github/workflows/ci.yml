name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test
        run: |
          node --test \
            scripts/check-auth-invariant.test.mjs \
            scripts/preview.test.mjs \
            scripts/sign-out-plan.test.mjs \
            scripts/migration-plan.test.mjs \
            scripts/browser-smoke-verdict.test.mjs
          node --experimental-strip-types --test \
            src/lib/app-data/app-data.test.ts \
            src/lib/app-data/readiness-schedule.test.ts \
            src/lib/auth/gate-identity.test.ts \
            src/lib/auth/sign-in-gate.test.ts
      - run: npm run build
